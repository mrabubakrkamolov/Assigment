<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font-family: system-ui;
      padding: 24px;
      text-align: center;
    }

    #reset {
      padding: 14px 32px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      color: white;
      cursor: pointer;
      background-color: red;
    }

    #clicker {
      padding: 14px 32px;
      font-size: 18px;
      border: none;
      background: #1a56db;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.4s, transform 0.3s ease, box-shadow 0.3s ease;
    }

    #clicker.done {
      background: #16a34a;
    }

    #count {
      font-size: 32px;
      font-weight: bold;
      margin: 16px 0;
    }

    .message {
      font-size: 16px;
      color: #666;
    }

    #reset:hover,
    #clicker:hover {
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>

<body>
  <button id="clicker">Click me!</button>
  <p id="count">0</p>
  <p class="message">Keep clicking...</p>

  <button id="reset">Reset!</button>
  <p class="message">click to reset</p>

  <script>
    const restart = document.querySelector('#reset')
    const btn = document.querySelector('#clicker');
    const countEl = document.querySelector('#count');
    const msg = document.querySelector('#message');
    let count = 0;

    btn.addEventListener('click', () => {
      count++;
      countEl.textContent = count;
      if (count >= 5) {
        btn.classList.add('done');
        msg.textContent = '🎉 Congratulations! You clicked 5 times!';
      }
    });

    restart.addEventListener('click', () => {
      count = 0;
      countEl.textContent = count;
    })
  </script>
</body>

</html>
