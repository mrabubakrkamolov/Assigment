<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 420px; margin: auto; }
    h2 { color: #1a56db; }
    #search { width: 100%; padding: 10px 14px; font-size: 16px; border: 2px solid #1a56db; border-radius: 10px; margin-bottom: 14px; box-sizing: border-box; }
    .student { padding: 10px 14px; margin-bottom: 6px; background: #f0f4ff; border-radius: 8px; border: 1px solid #c8d4f0; font-size: 15px; }
    mark { background: #f7df1e; border-radius: 3px; }
    #no-results { display: none; color: #9ca3af; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <h2>Search your hero</h2>
  <input id="search" type="text" placeholder="Search avengers...">
  <div id="student-list">
    <div class="student" data-name="Capitan America">Capitan America — Capitan of the group</div>
    <div class="student" data-name="Iron-Man">Iron-Man — A genius billionaire </div>
    <div class="student" data-name="Spider-Man">Spider-Man — Invented by Iron-Man(joking)</div>
    <div class="student" data-name="Hulk">Hulk — Angry boy</div>
    <div class="student" data-name="Vision">Vision — Invented by Iron-Man</div>
    <div class="student" data-name="Kang Seojun">Thor — Good boy</div>
  </div>
  <p id="no-results">others not exist</p>

  <script>
    const searchInput = document.querySelector('#search');
    const students = document.querySelectorAll('.student');
    const noResults = document.querySelector('#no-results');

    students.forEach(student => {
      student.dataset.original = student.textContent;
    });

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      let visibleCount = 0;

      students.forEach(student => {
        const originalText = student.dataset.original;
        const searchName = student.getAttribute('data-name').toLowerCase();

        if (searchName.includes(term)) {
          student.style.display = '';
          visibleCount++;

          if (term !== '') {
            const regex = new RegExp(`(${term})`, 'gi');
            student.innerHTML = originalText.replace(regex, '<mark>$1</mark>');
          } else {
            student.innerHTML = originalText; 
          }
        } else {
          student.style.display = 'none';
        }
      });

      noResults.style.display = visibleCount === 0 ? 'block' : 'none';
    });
  </script>
</body>
</html>
