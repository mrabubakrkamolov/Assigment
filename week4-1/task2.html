<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font-family: system-ui;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .card {
      padding: 24px;
      border-radius: 16px;
      width: 260px;
      background: #f0f4ff;
      border: 2px solid #c8d4f0;
      text-align: center;
      transition: all 0.3s;
    }

    .card.dark {
      background: #1a2340;
      border-color: #3a4a70;
      color: white;
    }


    .avatar img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #1a56db;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 12px;
    }

    button {
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      border: none;
      margin-top: 14px;
      font-weight: bold;
    }

    .avatar .avatardark {
      display: none;
    }
  </style>
</head>

<body>
  <div id="card" class="card">
    <div class="avatar">
      <img class="avatardark" id="dark-avatar" src=" https://i.pinimg.com/736x/20/1d/95/201d95ab7d5f17d8cb8c9ebc40d85eaa.jpg"
        alt="avatar1">
      <img id="light-avatar" src="https://i.pinimg.com/736x/be/0e/f8/be0ef80f06181662d0af541d7ccd5a60.jpg" alt="avatar">
    </div>
    <h2>Spider Man</h2>
    <p>Member of Avengers</p>
    <button id="toggle-btn">🌙 Dark Mode</button>
  </div>

  <script>
    const card = document.querySelector('#card');
    const toggleBtn = document.querySelector('#toggle-btn');
    const lightAvatar = document.querySelector('#light-avatar');
    const darkAvatar = document.querySelector('#dark-avatar');

    toggleBtn.addEventListener('click', () => {
      card.classList.toggle('dark');

      if (card.classList.contains('dark')) {
        toggleBtn.textContent = '☀️ Light Mode';
        lightAvatar.style.display = 'none';
        darkAvatar.style.display = 'inline-block';
      } else {
        toggleBtn.textContent = '🌙 Dark Mode';
        lightAvatar.style.display = 'inline-block';
        darkAvatar.style.display = 'none'; 
      }
    });
  </script>
</body>

</html>
