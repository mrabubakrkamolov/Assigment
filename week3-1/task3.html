<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task3</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .palette {
            display: flex;
            gap: 12px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
        }

        .swatch {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 13px;
            font-family: monospace;
            flex-shrink: 0;
        }

        .c1 {
            background-color: #6C63FF;
        }

        .c2 {
            background-color: #FF6B6B;
        }

        .c3 {
            background-color: #4ECDC4;
        }

        .c4 {
            background-color: #FFD166;
        }

        .c5 {
            background-color: #2D3142;
        }
    </style>
</head>

<body>
    <div class="palette">
        <div class="swatch c1"><strong>#6C63FF</strong></div>
        <div class="swatch c2"><strong>#FF6B6B</strong></div>
        <div class="swatch c3"><strong>#4ECDC4</strong></div>
        <div class="swatch c4"><strong>#FFD166</strong></div>
        <div class="swatch c5"><strong>#2D3142</strong></div>
    </div>
</body>

</html>
