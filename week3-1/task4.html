<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Box Model</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8fafc;
      padding: 50px;
      text-align: center;
    }

    .margin-box {
      background-color: #fbbf24;
      padding: 35px;
      width: 500px;
      margin: 0 auto;
    }

    .border-box {
      background-color: #64748b;
      padding: 30px;
      margin: 0 auto;
      color: white;
    }

    .padding-box {
      background-color: #38bdf8;
      padding: 30px;
      margin: 0 auto;
      color: #0c4a6e;
    }

    .content-box {
      background-color: #a78bfa;
      padding: 40px;
      margin: 0 auto;
      color: white;
    }

    .label {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <h1>CSS Box Model</h1>

  <div class="margin-box">
    <div class="label">MARGIN</div>

    <div class="border-box">
      <div class="label">BORDER</div>

      <div class="padding-box">
        <div class="label">PADDING</div>

        <div class="content-box">
          <div class="label">CONTENT</div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
