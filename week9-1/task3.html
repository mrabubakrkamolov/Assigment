<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Create Account</title>

  <style>
    body {
      font-family: system-ui;
      padding: 24px;
      max-width: 400px;
    }

    input {
      width: 100%;
      padding: 8px;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      margin-bottom: 4px;
      box-sizing: border-box;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 600;
    }

    .error {
      color: #c00;
      font-size: 13px;
      margin-bottom: 10px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .icon-btn {
      background: #1a7f5a;
      color: white;
      width: 36px;
      height: 36px;
      font-size: 18px;
      border-radius: 50%;
    }

    .submit-btn {
      background: #1a56db;
      color: white;
      padding: 10px 24px;
      font-size: 15px;
      width: 100%;
      margin-top: 8px;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    a img {
      display: block;
      width: 80px;
    }
  </style>
</head>

<body>

<main>
  <h1>Sign Up</h1>

  <!-- Accessible button name -->
  <button
    type="button"
    class="icon-btn"
    aria-label="Search"
    onclick="alert('Search clicked')"
  >
    🔍
  </button>

  <!-- Label connected to the email input -->
  <label for="email-field">Email address</label>
  <input
    type="email"
    id="email-field"
    placeholder="Enter your email"
    aria-describedby="email-error"
  >

  <div class="error" id="email-error">
    Error: Please enter a valid email address.
  </div>

  <!-- Error is identified by text, not color alone -->
  <div class="error">
    Error: Password too short.
  </div>

  <button type="button" class="submit-btn">
    Create account
  </button>

  <!-- Descriptive image alt text -->
  <a href="/about" style="margin-top:16px;display:inline-block">
    <img
      src=""
      alt="Learn more about our organization"
      style="background:#e0eaff;width:80px;height:40px;border-radius:4px"
    >
  </a>
</main>

</body>
</html>
