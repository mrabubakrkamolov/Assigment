
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #eef2ff;
    }

    .card {
      background: white;
      max-width: 350px;
      margin: 25px auto;
      padding: 25px;
      border-radius: 15px;
    }

    img {
      width: 120px;
      border-radius: 50%;
    }

    button {
      padding: 10px 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Random User Generator</h1>
  <button onclick="loadUser()">Get Random User</button>
  <p id="status"></p>

  <div class="card" id="userCard">
    Click the button to get a user.
  </div>

  <script>
    async function loadUser() {
      const status = document.getElementById("status");
      const card = document.getElementById("userCard");

      status.textContent = "Loading user...";
      card.innerHTML = "";

      try {
        const response = await fetch("https://randomuser.me/api/");

        if (!response.ok) {
          throw new Error("Could not load user.");
        }

        const data = await response.json();
        const user = data.results[0];

        const image = document.createElement("img");
        image.src = user.picture.large;
        image.alt = "User profile";

        const name = document.createElement("h2");
        name.textContent =
          user.name.first + " " + user.name.last;

        const email = document.createElement("p");
        email.textContent = user.email;

        const country = document.createElement("p");
        country.textContent = user.location.country;

        card.append(image, name, email, country);
        status.textContent = "User loaded!";
      } catch (error) {
        status.textContent =
          "Unable to load user. Please try again.";
      } finally {
        console.log("Request completed.");
      }
    }
  </script>
</body>
</html>
