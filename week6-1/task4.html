
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Celebrity Explorer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --red: #f52235;
      --blue: #168cff;
      --dark: #080c18;
      --card: rgba(15, 22, 42, 0.94);
      --text: #f5f7ff;
      --muted: #aab5ca;
    }

    body {
      min-height: 100vh;
      padding: 35px 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at top left,
          rgba(22, 140, 255, 0.18),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(245, 34, 53, 0.14),
          transparent 35%
        ),
        var(--dark);
    }

    .container {
      width: 100%;
      max-width: 1250px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin: 20px 0 35px;
    }

    header h1 {
      font-size: clamp(30px, 5vw, 52px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow:
        3px 3px 0 var(--red),
        6px 6px 0 rgba(22, 140, 255, 0.6);
    }

    header p {
      margin-top: 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .search-box {
      display: flex;
      gap: 12px;
      max-width: 700px;
      margin: 0 auto 20px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      padding: 15px 18px;
      color: white;
      background: #111a2e;
      border: 2px solid var(--blue);
      border-radius: 10px;
      outline: none;
      font-size: 16px;
      transition: 0.25s;
    }

    .search-box input:focus {
      border-color: var(--red);
      box-shadow: 0 0 15px #f5223544;
    }

    button {
      padding: 14px 23px;
      border: 0;
      border-radius: 10px;
      background: var(--red);
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: 0.25s;
    }

    button:hover {
      background: var(--blue);
      box-shadow: 0 0 18px #168cff55;
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .popular {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px 0 30px;
    }

    .popular button {
      padding: 9px 14px;
      background: #16223b;
      border: 1px solid #344766;
      border-radius: 20px;
      font-size: 13px;
    }

    .popular button:hover {
      background: var(--red);
      border-color: var(--red);
    }

    #status {
      min-height: 28px;
      margin: 20px 0;
      color: var(--blue);
      text-align: center;
      line-height: 1.6;
    }

    #celebrities {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(230px, 1fr)
      );
      gap: 22px;
    }

    .card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;

      background: var(--card);
      border: 1px solid #263754;
      border-radius: 14px;

      box-shadow: 0 8px 25px #00000030;
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--red);
      box-shadow:
        0 8px 30px #f5223520,
        0 0 18px #168cff12;
    }

    .image-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 260px;
      overflow: hidden;
      background: #111a2e;
      border-bottom: 2px solid var(--blue);
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s;
    }

    .card:hover .image-wrapper img {
      transform: scale(1.04);
    }

    .no-image {
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 18px;
    }

    .card h2 {
      margin-bottom: 12px;
      color: white;
      font-size: 19px;
      line-height: 1.4;
    }

    .description {
      flex: 1;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .wiki-link {
      display: inline-block;
      align-self: flex-start;
      padding: 10px 14px;
      color: white;
      background: #16223b;
      border: 1px solid var(--blue);
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      transition: 0.25s;
    }

    .wiki-link:hover {
      background: var(--blue);
    }

    .load-more {
      display: block;
      margin: 35px auto 10px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 550px) {
      body {
        padding: 20px 12px;
      }

      .search-box {
        flex-direction: column;
      }

      .search-box button {
        width: 100%;
      }

      #celebrities {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .image-wrapper {
        height: 190px;
      }

      .card-content {
        padding: 12px;
      }

      .card h2 {
        font-size: 16px;
      }

      .description {
        font-size: 13px;
      }

      .wiki-link {
        font-size: 12px;
        padding: 9px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>⭐ Celebrity Explorer</h1>
      <p>
        Discover famous actors, singers, athletes and other
        well-known people around the world.
      </p>
    </header>

    <form class="search-box" id="searchForm">
      <input
        id="searchInput"
        type="search"
        placeholder="Search Taylor Swift, Messi, Jackie Chan..."
        autocomplete="off"
        required
      >
      <button id="searchButton" type="submit">Search</button>
    </form>

    <div class="popular">
      <button type="button" data-search="Taylor Swift">Taylor Swift</button>
      <button type="button" data-search="Cristiano Ronaldo">Ronaldo</button>
      <button type="button" data-search="Lionel Messi">Lionel Messi</button>
      <button type="button" data-search="Tom Cruise">Tom Cruise</button>
      <button type="button" data-search="Jackie Chan">Jackie Chan</button>
      <button type="button" data-search="Lisa (rapper)">Lisa</button>
      <button type="button" data-search="Kim Kardashian">Kim Kardashian</button>
      <button type="button" data-search="MrBeast">MrBeast</button>
    </div>

    <p id="status" role="status" aria-live="polite">
      Search for a celebrity to get started.
    </p>

    <section id="celebrities" aria-label="Celebrity search results"></section>

    <button id="loadMore" class="load-more hidden" type="button">
      Load More
    </button>
  </main>

  <script>
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const celebritiesContainer = document.getElementById("celebrities");
    const status = document.getElementById("status");
    const loadMoreButton = document.getElementById("loadMore");

    let currentQuery = "";
    let currentOffset = 0;
    let hasMore = false;
    let isLoading = false;
    let requestNumber = 0;

    const RESULTS_PER_PAGE = 20;

    async function searchCelebrities(query, append = false) {
      query = query.trim();

      if (!query || isLoading) return;

      if (!append) {
        currentQuery = query;
        currentOffset = 0;
        celebritiesContainer.innerHTML = "";
        loadMoreButton.classList.add("hidden");
      }

      isLoading = true;
      const thisRequest = ++requestNumber;

      searchButton.disabled = true;
      loadMoreButton.disabled = true;
      status.textContent = "Searching Wikipedia...";

      try {
        const params = new URLSearchParams({
          action: "query",
          generator: "search",
          gsrsearch: query,
          gsrnamespace: "0",
          gsrlimit: String(RESULTS_PER_PAGE),
          gsroffset: String(currentOffset),
          prop: "pageimages|extracts|info",
          piprop: "thumbnail",
          pithumbsize: "400",
          exintro: "1",
          explaintext: "1",
          exsentences: "3",
          inprop: "url",
          redirects: "1",
          format: "json",
          formatversion: "2",
          origin: "*"
        });

        const response = await fetch(
          "https://en.wikipedia.org/w/api.php?" + params.toString()
        );

        if (!response.ok) {
          throw new Error("Wikipedia returned HTTP " + response.status);
        }

        const data = await response.json();

        // Ignore results if a newer search was started.
        if (thisRequest !== requestNumber) return;

        const pages = data.query?.pages || [];

        if (!append) {
          celebritiesContainer.innerHTML = "";
        }

        if (pages.length === 0 && !append) {
          status.textContent =
            "No results found. Try a different name.";
          hasMore = false;
          loadMoreButton.classList.add("hidden");
          return;
        }

        pages.forEach(page => {
          const card = document.createElement("article");
          card.className = "card";

          const imageWrapper = document.createElement("div");
          imageWrapper.className = "image-wrapper";

          if (page.thumbnail?.source) {
            const image = document.createElement("img");
            image.src = page.thumbnail.source;
            image.alt = page.title;
            image.loading = "lazy";

            image.onerror = () => {
              image.remove();
              const fallback = document.createElement("div");
              fallback.className = "no-image";
              fallback.textContent = "No image available";
              imageWrapper.appendChild(fallback);
            };

            imageWrapper.appendChild(image);
          } else {
            const fallback = document.createElement("div");
            fallback.className = "no-image";
            fallback.textContent = "No image available";
            imageWrapper.appendChild(fallback);
          }

          const content = document.createElement("div");
          content.className = "card-content";

          const title = document.createElement("h2");
          title.textContent = page.title;

          const description = document.createElement("p");
          description.className = "description";
          description.textContent =
            page.extract || "No description is available.";

          const link = document.createElement("a");
          link.className = "wiki-link";
          link.textContent = "Read Biography ↗";
          link.href =
            page.fullurl ||
            "https://en.wikipedia.org/wiki/" +
              encodeURIComponent(page.title.replace(/ /g, "_"));
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          content.append(title, description, link);
          card.append(imageWrapper, content);
          celebritiesContainer.appendChild(card);
        });

        currentOffset += pages.length;
        hasMore = Boolean(data.continue?.gsroffset);

        status.textContent =
          `Showing ${currentOffset} results for "${currentQuery}".`;

        loadMoreButton.classList.toggle("hidden", !hasMore);

      } catch (error) {
        if (thisRequest !== requestNumber) return;

        console.error("Celebrity Explorer error:", error);
        status.textContent =
          "Could not load results. Check your internet and try again.";
      } finally {
        if (thisRequest === requestNumber) {
          isLoading = false;
          searchButton.disabled = false;
          loadMoreButton.disabled = false;
        }
      }
    }

    searchForm.addEventListener("submit", event => {
      event.preventDefault();
      searchCelebrities(searchInput.value);
    });

    document.querySelectorAll("[data-search]").forEach(button => {
      button.addEventListener("click", () => {
        const query = button.dataset.search;
        searchInput.value = query;
        searchCelebrities(query);
      });
    });

    loadMoreButton.addEventListener("click", () => {
      if (hasMore && !isLoading) {
        searchCelebrities(currentQuery, true);
      }
    });
  </script>
</body>
</html>
