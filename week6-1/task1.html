<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Joke Fetcher by Spiderman</title>

  <style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Roboto:wght@400;500;700&display=swap');

:root {
  --spider-red: #ff2338;
  --spider-blue: #087cff;
  --dark: #070911;
  --panel: #111521;
  --white: #f4f6ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 50px 20px;
  font-family: 'Roboto', sans-serif;
  color: var(--white);
  background:
    radial-gradient(ellipse at 10% 10%, #321019 0%, transparent 35%),
    radial-gradient(ellipse at 90% 85%, #071e48 0%, transparent 40%),
    var(--dark);
  overflow-x: hidden;
  position: relative;
}

/* Spider web background */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.13;
  background-image:
    repeating-radial-gradient(
      circle at 0% 0%,
      transparent 0 38px,
      #ff3348 39px 40px,
      transparent 41px 75px
    ),
    repeating-linear-gradient(
      45deg,
      transparent 0 75px,
      #ff3348 76px 77px,
      transparent 78px 150px
    );
  mask-image: linear-gradient(to bottom right, black, transparent 75%);
  z-index: -1;
}

.container,
main,
.app {
  width: min(760px, 100%);
  margin: 0 auto;
}

/* Main heading */
h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(2rem, 6vw, 4.5rem);
  font-weight: 900;
  text-transform: uppercase;
  text-align: center;
  letter-spacing: 3px;
  line-height: 1.15;
  margin: 15px 0;
  color: #fff;
  text-shadow:
    3px 3px 0 var(--spider-red),
    -3px -2px 0 var(--spider-blue),
    0 0 30px #ff233855;
}

h1 span {
  color: var(--spider-red);
}

p {
  line-height: 1.7;
}

/* Main joke card */
.card,
.joke-card,
#joke-container {
  position: relative;
  margin: 35px auto;
  padding: 35px;
  background: linear-gradient(145deg, #171b29, #0b0e17);
  border: 1px solid #343b50;
  border-top: 3px solid var(--spider-red);
  border-bottom: 3px solid var(--spider-blue);
  border-radius: 4px 24px 4px 24px;
  box-shadow:
    0 0 35px #0008,
    -8px 8px 0 #ff233814,
    8px -8px 0 #087cff14;
  overflow: hidden;
}

.card::before,
.joke-card::before,
#joke-container::before {
  content: "SPIDER-SENSE // ACTIVE";
  display: block;
  color: var(--spider-red);
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 3px;
  margin-bottom: 25px;
}

/* Joke setup */
#setup,
.setup {
  font-size: clamp(1.2rem, 3vw, 1.7rem);
  font-weight: 700;
  line-height: 1.5;
  color: #fff;
}

/* Punchline */
#punchline,
.punchline {
  margin-top: 25px;
  padding: 18px 20px;
  background: #ff23380c;
  border-left: 3px solid var(--spider-red);
  color: #ffb9c0;
  font-size: 1.05rem;
  line-height: 1.7;
}

/* Buttons */
button {
  position: relative;
  padding: 15px 25px;
  margin: 8px 6px 8px 0;
  border: none;
  border-radius: 3px 12px 3px 12px;
  background: var(--spider-red);
  color: white;
  font-family: 'Orbitron', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 5px 0 #a80c20;
  transition:
    transform 0.2s ease,
    background 0.2s ease,
    box-shadow 0.2s ease;
}

button:hover {
  transform: translateY(-3px) skewX(-2deg);
  background: #ff4355;
  box-shadow: 0 8px 0 #a80c20, 0 0 22px #ff233866;
}

button:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #a80c20;
}

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 5px;
}

/* Secondary buttons */
button.secondary,
#save-favourite,
.favorite-button {
  background: var(--spider-blue);
  box-shadow: 0 5px 0 #034ca4;
}

button.secondary:hover,
#save-favourite:hover,
.favorite-button:hover {
  background: #3294ff;
  box-shadow: 0 8px 0 #034ca4, 0 0 22px #087cff66;
}

/* Loading state */
#loading,
.loading {
  color: #8fc5ff;
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
  letter-spacing: 2px;
  text-align: center;
  padding: 20px;
}

.spinner {
  width: 38px;
  height: 38px;
  margin: 15px auto;
  border: 3px solid #ffffff18;
  border-top-color: var(--spider-red);
  border-right-color: var(--spider-blue);
  border-radius: 50%;
  animation: spider-spin 0.8s linear infinite;
}

@keyframes spider-spin {
  to {
    transform: rotate(360deg);
  }
}

/* Favourite section */
h2 {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  border-left: 4px solid var(--spider-blue);
  padding-left: 14px;
  margin-top: 45px;
}

#favorites,
#favourites,
.favorites {
  display: grid;
  gap: 14px;
}

.favorite,
.favorite-item {
  padding: 20px;
  background: #111521;
  border: 1px solid #252d42;
  border-left: 3px solid var(--spider-blue);
  transition: border-color 0.2s, transform 0.2s;
}

.favorite:hover,
.favorite-item:hover {
  border-color: var(--spider-red);
  transform: translateX(5px);
}

/* Error message */
.error {
  padding: 15px;
  color: #ffb9c0;
  background: #ff233812;
  border: 1px solid #ff233855;
  border-radius: 4px;
}

/* Mobile */
@media (max-width: 600px) {
  body {
    padding: 30px 15px;
  }

  .card,
  .joke-card,
  #joke-container {
    padding: 22px;
  }

  button {
    width: 100%;
    margin: 8px 0;
  }

  h1 {
    letter-spacing: 1px;
  }
}
  </style>
</head>

<body>
  <main class="container">
    <h1>😂 Random Joke Fetcher</h1>
    <p class="subtitle">Need a laugh? Load a random joke!</p>

    <section class="card">
      <h2>Today's Joke</h2>

      <div class="joke-box" aria-live="polite">
        <p class="setup" id="setup">
          Click the button to get a joke!
        </p>

        <p class="punchline" id="punchline"></p>

        <div id="spinner" class="spinner" hidden></div>
      </div>

      <div class="buttons">
        <button id="loadBtn">🎲 Load Joke</button>
        <button id="saveBtn" class="favorite-btn" disabled>
          ❤️ Save Favourite
        </button>
      </div>

      <p id="status" class="status" role="status"></p>
    </section>

    <section class="favorites">
      <h2>❤️ Favourite Jokes</h2>
      <div id="favoritesList"></div>
    </section>
  </main>

  <script>
    const loadBtn = document.getElementById("loadBtn");
    const saveBtn = document.getElementById("saveBtn");
    const setupEl = document.getElementById("setup");
    const punchlineEl = document.getElementById("punchline");
    const spinner = document.getElementById("spinner");
    const statusEl = document.getElementById("status");
    const favoritesList = document.getElementById("favoritesList");

    let currentJoke = null;

    function getFavorites() {
      try {
        return JSON.parse(
          localStorage.getItem("favoriteJokes") || "[]"
        );
      } catch {
        return [];
      }
    }

    function setLoading(isLoading) {
      loadBtn.disabled = isLoading;
      saveBtn.disabled = isLoading || !currentJoke;
      spinner.hidden = !isLoading;

      if (isLoading) {
        setupEl.textContent = "Loading...";
        punchlineEl.textContent = "";
        statusEl.textContent = "";
        statusEl.className = "status";
      }
    }

    async function loadJoke() {
      setLoading(true);
      currentJoke = null;

      try {
        const response = await fetch(
          "https://official-joke-api.appspot.com/random_joke"
        );

        if (!response.ok) {
          throw new Error("Could not load a joke.");
        }

        const joke = await response.json();

        if (!joke.setup || !joke.punchline) {
          throw new Error("The joke data was incomplete.");
        }

        currentJoke = {
          id: joke.id,
          setup: joke.setup,
          punchline: joke.punchline
        };

        setupEl.textContent = currentJoke.setup;
        punchlineEl.textContent = currentJoke.punchline;
        statusEl.textContent = "Here's your joke! 😄";
        saveBtn.disabled = false;
      } catch (error) {
        setupEl.textContent = "Oops! 😕";
        punchlineEl.textContent =
          "We couldn't load a joke. Please check your connection and try again.";
        statusEl.textContent = "Something went wrong. Please try again.";
        statusEl.className = "status error";
        saveBtn.disabled = true;
      } finally {
        spinner.hidden = true;
        loadBtn.disabled = false;
      }
    }

    function saveFavorite() {
      if (!currentJoke) return;

      const favorites = getFavorites();

      const alreadySaved = favorites.some(
        joke => joke.id === currentJoke.id
      );

      if (alreadySaved) {
        statusEl.textContent = "This joke is already in your favourites.";
        return;
      }

      favorites.push(currentJoke);

      try {
        localStorage.setItem(
          "favoriteJokes",
          JSON.stringify(favorites)
        );

        statusEl.textContent = "Joke saved to favourites! ❤️";
        renderFavorites();
      } catch {
        statusEl.textContent =
          "Could not save the favourite in this browser.";
        statusEl.className = "status error";
      }
    }

    function removeFavorite(id) {
      const favorites = getFavorites().filter(
        joke => joke.id !== id
      );

      localStorage.setItem(
        "favoriteJokes",
        JSON.stringify(favorites)
      );

      renderFavorites();
    }

    function renderFavorites() {
      const favorites = getFavorites();
      favoritesList.replaceChildren();

      if (favorites.length === 0) {
        const message = document.createElement("p");
        message.textContent = "No favourites saved yet.";
        message.className = "subtitle";
        favoritesList.appendChild(message);
        return;
      }

      favorites.forEach(joke => {
        const item = document.createElement("article");
        item.className = "favorite-item";

        const setup = document.createElement("strong");
        setup.textContent = joke.setup;

        const punchline = document.createElement("p");
        punchline.textContent = joke.punchline;

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-btn";
        removeBtn.textContent = "Remove";
        removeBtn.addEventListener("click", () => {
          removeFavorite(joke.id);
        });

        item.append(setup, punchline, removeBtn);
        favoritesList.appendChild(item);
      });
    }

    loadBtn.addEventListener("click", loadJoke);
    saveBtn.addEventListener("click", saveFavorite);

    renderFavorites();
  </script>
</body>
</html>
