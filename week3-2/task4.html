<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  :root {
    --primary: #0f766e;
    --accent: #14b8a6;
    --bg: #f0fdfa;
    --text: #1e293b;
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #051a0a;
      --text: #d4edda;
    }
  }

  body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; transition: background 0.3s; }

  .btn {
    background: var(--primary);
    color: white; 
    border: none; 
    padding: 15px 25px; 
    cursor: pointer;
    border-radius: var(--radius);
    transition: background 0.2s;
  }
  
  .btn:hover {
    background: var(--accent);
  }

  .card {
    background: var(--bg);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px; 
    margin-top: 16px;
  }
</style>
</head>
<body>
  <button class="btn">Submit</button>
  <div class="card">A themed card using CSS variables</div>
</body>
</html>
