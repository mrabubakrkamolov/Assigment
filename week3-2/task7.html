<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Task7</title>
<style>
  :root {
    --primary: #0f766e;
    --accent: #14b8a6;
    --bg: #f0fdfa;
    --text: #1e293b;
    --card-bg: #ffffff;
    --nav-bg: #1e293b;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #051a0a;
      --text: #d4edda;
      --card-bg: #0b2017;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: sans-serif; 
  }

  /* 2. Fixed nav */
  nav {
    position: fixed;
    top: 0; left: 0; width: 100%;
    background: var(--nav-bg);
    color: white;
    display: flex;
    justify-content: space-between;
    padding: 16px 32px;
    z-index: 1000;
  }
  nav span { font-weight: bold; font-size: 1.2rem; }
  nav a { 
    color: #cbd5e1; 
    text-decoration: none; 
    margin-left: 24px; 
    transition: color 0.2s; 
  }
  nav a:hover { color: var(--accent); }

  /* 3. @keyframes fadeIn + hero */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hero {
    padding: 120px 32px 60px;
    text-align: center;
    animation: fadeIn 1s ease-out forwards;
  }
  .hero h1 { color: var(--primary); margin-bottom: 12px; }

  /* 4. Responsive grid with ::before icons + hover */
  .skills-section { padding: 0 32px 60px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin-top: 24px;
  }
  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  .card {
    background: var(--card-bg);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 24px;
    transition: transform 0.3s, box-shadow 0.3s;
    font-weight: bold;
  }
  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 24px rgba(20, 184, 166, 0.2);
  }
  .card[data-icon]::before {
    content: attr(data-icon) ' ';
    font-size: 2.5rem;
    display: block;
    margin-bottom: 12px;
  }

  /* 5. Sticky section headings */
  .sticky-h2 {
    position: sticky;
    top: 55px; /* Sits just below the fixed nav */
    background: var(--bg);
    padding: 16px 0;
    font-size: 24px;
    color: var(--primary);
    border-bottom: 2px solid var(--accent);
    z-index: 100;
  }
</style>
</head>
<body>
  <nav>
    <span>YOUR NAME</span>
    <div><a href="#">Home</a> <a href="#">Skills</a></div>
  </nav>
  <section class="hero">
    <h1>Hello, I am Student</h1>
    <p>Computer Science · Gachon University · Week 3 CSS Advanced</p>
  </section>
  <section class="skills-section">
    <h2 class="sticky-h2">My Skills</h2>
    <div class="grid">
      <div class="card" data-icon="🌐">HTML5</div>
      <div class="card" data-icon="🎨">CSS3</div>
      <div class="card" data-icon="⚡">JavaScript</div>
    </div>
  </section>
</body>
</html>
