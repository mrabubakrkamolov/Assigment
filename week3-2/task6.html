<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task6</title>

    <style>
  :root {
    --primary: #0f766e;
    --accent: #14b8a6;
    --bg: #f0fdfa;
    --text: #1e293b;
    --card-bg: #ffffff;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { 
    background: var(--bg);
    color: var(--text);
    font-family: sans-serif;
    padding: 24px;
  }

  .grid { 
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin-top: 20px;
  }

  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }

  .card { 
    background: var(--card-bg);
    border: 2px solid var(--accent);
    padding: 24px;
    border-radius: var(--radius);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card:hover { 
    transform: translateY(-6px);
    box-shadow: 0 10px 25px rgba(20, 184, 166, 0.2);
  }

  .card[data-icon]::before { 
    content: attr(data-icon) '  '; 
    font-size: 2rem; 
    display: block; 
    margin-bottom: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #051a0a;
      --text: #d4edda;
      --card-bg: #0b2017;
    }
  }
</style>
<h1>My Skills</h1>
  <div class="grid">
    <div class="card" data-icon="🌐">HTML5 — Structure</div>
    <div class="card" data-icon="🎨">CSS3 — Styling</div>
    <div class="card" data-icon="⚡">JavaScript — Behaviour</div>
    <div class="card" data-icon="📐">Flexbox — 1D Layout</div>
    <div class="card" data-icon="🗂">Grid — 2D Layout</div>
    <div class="card" data-icon="📱">Responsive — Any Screen</div>
  </div>
</head>
