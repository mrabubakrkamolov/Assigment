<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task1</title>

    <style>
        .card {
            background: white;
            width: 280px;
            height: 180px;
            border-radius: 18px;
            position: relative;
            margin: 40px;
            border: 2px solid #14b8a6;
        }

        .badge {
            top: -12px;
            font-size: 12px;
            font-weight: bold;
            right: 16px;
            background: #0f766e;
            position: absolute;
            color:  white;
            background-color: teal;
            border-radius: 20px;
            padding: 4px 12px;

        }
    </style>
</head>

<body>

    <div class="card">
        <span class="badge">SALE</span>
        <p style="padding: 15px; color: #0f766e; font-weight: bold;",>Content is not available 404</p>
    </div>

</body>

</html>
