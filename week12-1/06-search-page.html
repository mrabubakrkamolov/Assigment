<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>06 · Search Page | Week 12-1</title>
    <link rel="stylesheet" href="./styles.css" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const FRUITS = ["apple", "banana", "cherry", "grape", "kiwi", "mango", "orange", "peach", "pear", "strawberry"];

        function Shell({ num, title, subtitle, children }) {
            return (
                <div className="page">
                    <div className="topbar">
                        <a href="./index.html">← Week 12-1</a>
                        <span className="badge">{num}</span>
                    </div>
                    <div className="card">
                        <h1>{title}</h1>
                        <p className="subtitle">{subtitle}</p>
                        {children}
                    </div>
                </div>
            );
        }

        function SearchBar({ onSearch }) {
            const [input, setInput] = useState("");

            function handleChange(event) {
                const value = event.target.value;
                setInput(value);
                onSearch(value);
            }

            return (
                <div className="field">
                    <label>Search fruits</label>
                    <input value={input} onChange={handleChange} placeholder="e.g. ap, an..." />
                </div>
            );
        }

        function ResultList({ query, results }) {
            return (
                <div>
                    <h2>Results {query && <>for “{query}”</>}</h2>
                    {results.length === 0 ? (
                        <p className="hint">No results found.</p>
                    ) : (
                        <ul className="list">
                            {results.map(fruit => <li key={fruit}>{fruit}</li>)}
                        </ul>
                    )}
                </div>
            );
        }

        function Demo() {
            const [query, setQuery] = useState("");
            const [results, setResults] = useState(FRUITS);

            function handleSearch(value) {
                setQuery(value);
                const q = value.trim().toLowerCase();
                setResults(q ? FRUITS.filter(fruit => fruit.includes(q)) : FRUITS);
            }

            return (
                <Shell
                    num="06 · Search Page"
                    title="Lifting state up"
                    subtitle="The parent owns the state. SearchBar sends updates up through a callback, and ResultList receives results through props."
                >
                    <div className="grid">
                        <SearchBar onSearch={handleSearch} />
                        <ResultList query={query} results={results} />
                    </div>
                    <p className="hint ok">Data flows down → props, events flow up → callback.</p>
                </Shell>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
</body>

</html>
